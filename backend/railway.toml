# Despliegue de la API en Railway.
#
# Railway corre contenedores de larga vida, que es lo que este backend
# necesita: el scheduler de las 08:00 vive en el proceso, y el pool de
# conexiones tiene sentido porque hay un proceso solo.
#
# Variables que hay que cargar en el panel de Railway (ninguna va al repo):
#
#   DATABASE_URL                  la que da el Postgres de Railway
#   ENVIRONMENT                   production
#   DEV_BYPASS_AUTH               false      <-- CRITICO
#   FRONTEND_URL                  https://sistema.ubicar-rent.com.ar
#   LANDING_URL                   https://ubicar-rent.com.ar
#   STORAGE_PROVIDER              r2         <-- CRITICO: el disco es volatil
#   STORAGE_BUCKET                ubicar-rent-docs
#   STORAGE_ACCESS_KEY_ID         (de Cloudflare R2)
#   STORAGE_SECRET_ACCESS_KEY     (de Cloudflare R2)
#   STORAGE_ENDPOINT_URL          https://<account>.r2.cloudflarestorage.com
#   STORAGE_PUBLIC_BASE_URL       https://archivos.ubicar-rent.com.ar
#   RESEND_API_KEY                (de Resend)
#   FROM_EMAIL                    noreply@ubicar-rent.com.ar
#   NOTIFICACIONES_DIGEST_DESTINATARIOS   mails separados por coma
#   CRON_SECRET                   un token largo al azar
#
# Cobro online (Mercado Pago). Faltaban en esta lista: se agregaron el 14/08.
#
#   PAGOS_PROVIDER                mercadopago
#   MERCADOPAGO_ACCESS_TOKEN      APP_USR-...  <-- el interruptor: sin token,
#                                                  la web cobra por transferencia
#   MERCADOPAGO_SANDBOX           false
#                                 <-- false SIEMPRE, incluso con credenciales
#                                     de prueba. Solo sirve para abrir
#                                     `sandbox_init_point`, que es el flujo
#                                     viejo; el esquema nuevo de usuarios de
#                                     prueba usa `init_point` igual que
#                                     produccion (verificado el 19/08 contra
#                                     la API real)
#   MERCADOPAGO_WEBHOOK_SECRET    (panel de MP > Webhooks)  <-- OPCIONAL
#                                 <-- vacia: no se valida la firma y el
#                                     webhook funciona igual. Hay una POR
#                                     AMBIENTE: cargar la de prueba en
#                                     produccion rechaza TODOS los avisos y
#                                     ninguna reserva se confirma. El sintoma
#                                     es el webhook en rojo en el panel de MP
#                                     y `firma invalida` en estos logs
#   BACKEND_PUBLIC_URL            https://ubicar-system-production.up.railway.app
#                                 <-- el notification_url del webhook. Tiene que
#                                     coincidir con lo cargado en el panel de MP.
#                                     OJO: va la URL de Railway, NO
#                                     api.ubicar-rent.com.ar — ese subdominio
#                                     todavia no esta conectado (verificado el
#                                     14/08: no resuelve). El dia que se
#                                     conecte, se cambia aca Y en el panel de MP
#   WEB_URL                       https://ubicar-rent.com.ar
#                                 <-- CRITICO y facil de olvidar: de aca salen
#                                     las back_urls de la preferencia, y su
#                                     default es localhost:3200. Mercado Pago
#                                     RECHAZA una preferencia que apunte a
#                                     localhost, asi que sin esto el boton de
#                                     pagar tira error y no se llega al checkout
#
# Prospeccion: campañas de mail en frio a empresas (docs/PROSPECCION.md).
# Se agregaron el 21/11. Todas tienen un default que anda; la unica que hace
# falta para que el sistema se entere de rebotes, quejas y respuestas es el
# secreto del webhook.
#
#   PROSPECCION_WEBHOOK_SECRET    whsec_...  (Resend > Webhooks > Signing Secret)
#                                 <-- vacia: el webhook responde 404, no se ven
#                                     rebotes ni quejas y el freno automatico
#                                     de las casillas queda ciego
#   PROSPECCION_SECRETO           un token largo al azar  <-- firma los links de
#                                     baja. Fijarlo UNA vez: cambiarlo rompe los
#                                     links de los mails ya enviados
#   PROSPECCION_RESEND_API_KEY    re_...  OPCIONAL: vacia usa RESEND_API_KEY.
#                                 <-- de "Full access" para que la pantalla
#                                     Casillas cree y verifique el subdominio;
#                                     con una de solo-envio pasa a modo manual
#   PROSPECCION_DOMINIO_RAIZ      ubicar-rent.com.ar  OPCIONAL (se deduce de FROM_EMAIL)
#   PROSPECCION_RESEND_REGION     sa-east-1  OPCIONAL
#   PROSPECCION_TOPE_DIARIO       150  OPCIONAL: tope entre todas las casillas
#   PROSPECCION_SOLO_A            OPCIONAL: mails separados por coma. Con algo
#                                     aca, SOLO a esos les sale de verdad (para
#                                     la primera prueba en produccion). Vaciarla
#                                     para mandar en serio
#   PROSPECCION_FIRMA_NOMBRE      OPCIONAL: la firma que se propone (ej. Franco)
#   PROSPECCION_FIRMA_TELEFONO    291 418-0554  OPCIONAL
#   PROSPECCION_WEB               www.ubicar-rent.com.ar  OPCIONAL
#   PROSPECCION_DMARC_REPORTES    OPCIONAL: adonde llegan los reportes DMARC

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Las migraciones corren antes de levantar el servidor. Si fallan, el deploy
# falla y queda la version anterior sirviendo — que es lo que se quiere: mejor
# no desplegar que desplegar contra un esquema a medias.
# **`sh -c` es obligatorio y no es un adorno.** Railway ejecuta el startCommand
# directamente, sin pasarlo por un shell: `$PORT` no se expande, `&&` no
# encadena y `;` no separa. Se comprobo imprimiendo la variable, que salio
# literal como `${PORT:-8080}`.
#
# El sintoma de no tener esto: uvicorn recibe `--port ${PORT:-8080}` como
# texto, no puede convertirlo a numero, muere al instante, el contenedor
# reinicia en bucle y el dominio devuelve "Application not found" — con el
# build en verde y sin una sola linea de error en el log.
#
# **`&&` y no `;`.** Estuvo con `;` y eso contradecia el comentario de arriba:
# una migracion que fallaba no frenaba nada — la API levantaba igual contra el
# esquema viejo y devolvia 500 en las pantallas que tocaban la columna nueva,
# con el deploy en verde y sin una linea de error.
#
# Con `&&`, si alembic falla el contenedor muere, el healthcheck no pasa y
# **Railway deja sirviendo la version anterior**, que es exactamente lo que el
# comentario de arriba promete. Una migracion rota se ve como un deploy que no
# sale, que es como tiene que verse.
#
# `exec` para que uvicorn reemplace al shell y reciba las senales de Railway.
startCommand = "sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}'"

healthcheckPath = "/health"
# 30 segundos no alcanzaban. El arranque hace, en este orden: conectar a
# Postgres, revisar las 52 migraciones, importar la app entera y recién ahí
# escuchar. En un contenedor frío eso pasa del minuto, y el healthcheck
# cortaba antes — el deploy fallaba con "service unavailable" aunque todo
# estuviera bien.
healthcheckTimeout = 300

# Un reinicio en loop por una variable mal cargada no tiene que quedar
# reintentando para siempre.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
