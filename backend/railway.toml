# Despliegue de la API en Railway.
#
# Railway corre contenedores de larga vida, que es lo que este backend
# necesita: el scheduler de las 08:00 vive en el proceso, y el pool de
# conexiones tiene sentido porque hay un proceso solo.
#
# Variables que hay que cargar en el panel de Railway (ninguna va al repo):
#
#   DATABASE_URL                  la que da el Postgres de Railway
#   ENVIRONMENT                   production
#   DEV_BYPASS_AUTH               false      <-- CRITICO
#   FRONTEND_URL                  https://sistema.ubicar-rent.com.ar
#   LANDING_URL                   https://ubicar-rent.com.ar
#   STORAGE_PROVIDER              r2         <-- CRITICO: el disco es volatil
#   STORAGE_BUCKET                ubicar-rent-docs
#   STORAGE_ACCESS_KEY_ID         (de Cloudflare R2)
#   STORAGE_SECRET_ACCESS_KEY     (de Cloudflare R2)
#   STORAGE_ENDPOINT_URL          https://<account>.r2.cloudflarestorage.com
#   STORAGE_PUBLIC_BASE_URL       https://archivos.ubicar-rent.com.ar
#   RESEND_API_KEY                (de Resend)
#   FROM_EMAIL                    noreply@ubicar-rent.com.ar
#   NOTIFICACIONES_DIGEST_DESTINATARIOS   mails separados por coma
#   CRON_SECRET                   un token largo al azar
#
# Cobro online (Mercado Pago). Faltaban en esta lista: se agregaron el 14/08.
#
#   PAGOS_PROVIDER                mercadopago
#   MERCADOPAGO_ACCESS_TOKEN      APP_USR-...  <-- el interruptor: sin token,
#                                                  la web cobra por transferencia
#   MERCADOPAGO_SANDBOX           false
#   BACKEND_PUBLIC_URL            https://api.ubicar-rent.com.ar
#                                 <-- el notification_url del webhook. Tiene que
#                                     coincidir con lo cargado en el panel de MP
#   WEB_URL                       https://ubicar-rent.com.ar
#                                 <-- CRITICO y facil de olvidar: de aca salen
#                                     las back_urls de la preferencia, y su
#                                     default es localhost:3200. Mercado Pago
#                                     RECHAZA una preferencia que apunte a
#                                     localhost, asi que sin esto el boton de
#                                     pagar tira error y no se llega al checkout

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Las migraciones corren antes de levantar el servidor. Si fallan, el deploy
# falla y queda la version anterior sirviendo — que es lo que se quiere: mejor
# no desplegar que desplegar contra un esquema a medias.
# **`sh -c` es obligatorio y no es un adorno.** Railway ejecuta el startCommand
# directamente, sin pasarlo por un shell: `$PORT` no se expande, `&&` no
# encadena y `;` no separa. Se comprobo imprimiendo la variable, que salio
# literal como `${PORT:-8080}`.
#
# El sintoma de no tener esto: uvicorn recibe `--port ${PORT:-8080}` como
# texto, no puede convertirlo a numero, muere al instante, el contenedor
# reinicia en bucle y el dominio devuelve "Application not found" — con el
# build en verde y sin una sola linea de error en el log.
#
# `;` y no `&&` entre alembic y uvicorn: la base se migra por fuera del deploy,
# asi que un fallo de alembic no tiene por que impedir que el servidor levante.
# `exec` para que uvicorn reemplace al shell y reciba las senales de Railway.
startCommand = "sh -c 'alembic upgrade head; exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}'"

healthcheckPath = "/health"
# 30 segundos no alcanzaban. El arranque hace, en este orden: conectar a
# Postgres, revisar las 52 migraciones, importar la app entera y recién ahí
# escuchar. En un contenedor frío eso pasa del minuto, y el healthcheck
# cortaba antes — el deploy fallaba con "service unavailable" aunque todo
# estuviera bien.
healthcheckTimeout = 300

# Un reinicio en loop por una variable mal cargada no tiene que quedar
# reintentando para siempre.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
