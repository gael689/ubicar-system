<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ER Diagram — Ubicar Rent</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1f2e;
      border-bottom: 1px solid #2d3748;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #8bb8e8;
      letter-spacing: -0.3px;
    }

    header span {
      font-size: 12px;
      color: #64748b;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      background: #1a1f2e;
      border-bottom: 1px solid #2d3748;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      font-size: 12px;
      color: #94a3b8;
      margin-right: 4px;
    }

    .controls button {
      background: #2d3748;
      border: 1px solid #3d4f6b;
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .controls button:hover { background: #3d4f6b; }
    .controls button.active { background: #407EC9; border-color: #407EC9; color: #fff; }

    .zoom-controls {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .zoom-controls button {
      width: 30px;
      height: 30px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
    }

    .diagram-wrapper {
      overflow: auto;
      padding: 32px 24px;
      min-height: calc(100vh - 110px);
      cursor: grab;
    }

    .diagram-wrapper:active { cursor: grabbing; }

    #diagram-container {
      display: inline-block;
      transform-origin: top left;
      transition: transform 0.1s;
    }

    .mermaid svg {
      max-width: none !important;
    }

    .legend {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.8;
    }

    .legend h3 {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      top: 70px;
      right: 20px;
      background: #407EC9;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>📊 Diagrama Entidad-Relación — Ubicar Rent</h1>
  <span>15 entidades · 20+ relaciones</span>
</header>

<div class="controls">
  <label>Vista:</label>
  <button class="view-btn active" data-view="full">Completo</button>
  <button class="view-btn" data-view="core">Core (Reservas)</button>
  <button class="view-btn" data-view="financiero">Financiero</button>
  <button class="view-btn" data-view="flota">Flota</button>

  <div class="zoom-controls">
    <button onclick="zoom(-0.15)" title="Alejar">−</button>
    <button onclick="resetZoom()" title="Reset">⊙</button>
    <button onclick="zoom(0.15)" title="Acercar">+</button>
  </div>
</div>

<div class="diagram-wrapper" id="wrapper">
  <div id="diagram-container">
    <div class="mermaid" id="diagram"></div>
  </div>
</div>

<div class="legend">
  <h3>Referencias</h3>
  <div class="legend-item"><div class="legend-dot" style="background:#407EC9"></div> Entidad principal</div>
  <div class="legend-item"><div class="legend-dot" style="background:#059669"></div> Relación 1-a-muchos</div>
  <div class="legend-item"><div class="legend-dot" style="background:#D97706"></div> Relación 1-a-1</div>
  <div style="margin-top:8px; font-size:10px; color:#475569">
    PK = Primary Key<br>
    FK = Foreign Key<br>
    UK = Unique
  </div>
</div>

<div class="toast" id="toast">Vista actualizada</div>

<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    themeVariables: {
      primaryColor: '#1e2a3a',
      primaryTextColor: '#e2e8f0',
      primaryBorderColor: '#407EC9',
      lineColor: '#4a6080',
      secondaryColor: '#1a2535',
      tertiaryColor: '#0f1520',
      edgeLabelBackground: '#1a1f2e',
      attributeBackgroundColorEven: '#1a2535',
      attributeBackgroundColorOdd: '#1e2a3a',
      fontFamily: 'Inter, system-ui, sans-serif',
      fontSize: '13px'
    },
    er: {
      diagramPadding: 30,
      layoutDirection: 'TB',
      minEntityWidth: 120,
      minEntityHeight: 80,
      entityPadding: 15,
      useMaxWidth: false
    }
  });

  const views = {
    full: `erDiagram
    USUARIOS {
        int id PK
        string email UK
        string nombre
        string rol
        string auth0_id UK
        bool activo
        datetime created_at
    }
    VEHICULOS {
        int id PK
        string patente UK
        string marca
        string modelo
        int anio
        string tipo
        string color
        string estado
        int km_actual
        int km_proximo_service
        int km_entre_services
        bool activo
        datetime created_at
    }
    TARIFAS {
        int id PK
        int vehiculo_id FK
        string tipo
        decimal monto
        bool activo
        date vigencia_desde
    }
    CLIENTES {
        int id PK
        string nombre_completo
        string dni_cuit
        string telefono
        string email
        string licencia_numero
        string licencia_vencimiento
        string licencia_categoria
        string tipo
        bool es_frecuente
        text notas
        bool activo
        datetime created_at
    }
    CONDUCTORES_ADICIONALES {
        int id PK
        int cliente_id FK
        string nombre_completo
        string dni
        string licencia_numero
        string licencia_vencimiento
    }
    RESERVAS {
        int id PK
        int vehiculo_id FK
        int cliente_id FK
        int usuario_id FK
        string fecha_inicio
        string hora_inicio
        string fecha_fin
        string hora_fin
        string lugar_entrega
        string lugar_devolucion
        string estado
        datetime created_at
    }
    ALQUILERES {
        int id PK
        int reserva_id FK
        string checkout_fecha
        string checkout_hora
        int checkout_km
        int checkout_combustible
        text checkout_descripcion
        string checkin_fecha
        string checkin_hora
        int checkin_km
        int checkin_combustible
        text checkin_descripcion
        decimal horas_excedente
        decimal cargo_excedente
        bool excedente_bonificado
        int bonificado_por FK
        bool contrato_firmado
        string contrato_url
    }
    CONTRATOS {
        int id PK
        int alquiler_id FK
        string url_pdf
        bool firmado
        datetime fecha_generacion
        json datos_prellenados
        string link_prellenado
        datetime link_expiracion
    }
    PAGOS {
        int id PK
        int alquiler_id FK
        int cobrado_por FK
        decimal monto
        string medio_pago
        bool con_factura
        string fecha
        text notas
    }
    GASTOS {
        int id PK
        int vehiculo_id FK
        string tipo
        string descripcion
        decimal monto
        string medio_pago
        string fecha
        string proveedor
        int km_al_momento
        text notas
    }
    DOCUMENTOS {
        int id PK
        int vehiculo_id FK
        int cargado_por FK
        string tipo
        string nombre
        string url_archivo
        datetime fecha_carga
        string vigencia_desde
        string vigencia_hasta
    }
    CUENTAS_CORRIENTES {
        int id PK
        int cliente_id FK
        decimal saldo
        datetime updated_at
    }
    MOVIMIENTOS_CUENTA_CORRIENTE {
        int id PK
        int cuenta_corriente_id FK
        int alquiler_id FK
        string tipo
        string concepto
        decimal monto
        string fecha
    }
    ECHEQS {
        int id PK
        int alquiler_id FK
        int gasto_id FK
        string tipo
        decimal monto
        string fecha_emision
        string fecha_cobro
        string estado
        string contraparte
        string banco
        string numero_cheque
        text notas
    }
    PRESUPUESTOS {
        int id PK
        int cliente_id FK
        int vehiculo_id FK
        int created_by FK
        string fecha_inicio
        string fecha_fin
        int dias
        decimal tarifa_unitaria
        decimal descuento
        decimal total
        string estado
        text notas
        datetime created_at
    }
    VEHICULOS ||--o{ TARIFAS : tiene
    VEHICULOS ||--o{ RESERVAS : reservado_en
    VEHICULOS ||--o{ GASTOS : tiene
    VEHICULOS ||--o{ DOCUMENTOS : tiene
    VEHICULOS ||--o{ PRESUPUESTOS : cotizado_en
    CLIENTES ||--o{ CONDUCTORES_ADICIONALES : tiene
    CLIENTES ||--o{ RESERVAS : hace
    CLIENTES ||--|| CUENTAS_CORRIENTES : tiene
    CLIENTES ||--o{ PRESUPUESTOS : recibe
    USUARIOS ||--o{ RESERVAS : crea
    USUARIOS ||--o{ PAGOS : cobra
    USUARIOS ||--o{ DOCUMENTOS : carga
    USUARIOS ||--o{ PRESUPUESTOS : genera
    USUARIOS ||--o{ ALQUILERES : bonifica
    RESERVAS ||--|| ALQUILERES : origina
    ALQUILERES ||--|| CONTRATOS : tiene
    ALQUILERES ||--o{ PAGOS : recibe
    ALQUILERES ||--o{ MOVIMIENTOS_CUENTA_CORRIENTE : genera
    ALQUILERES ||--o{ ECHEQS : vinculado_a
    CUENTAS_CORRIENTES ||--o{ MOVIMIENTOS_CUENTA_CORRIENTE : registra
    GASTOS ||--o{ ECHEQS : vinculado_a`,

    core: `erDiagram
    USUARIOS {
        int id PK
        string email UK
        string nombre
        string rol
    }
    VEHICULOS {
        int id PK
        string patente UK
        string marca
        string modelo
        string estado
        int km_actual
    }
    CLIENTES {
        int id PK
        string nombre_completo
        string dni_cuit
        string telefono
        string licencia_vencimiento
    }
    RESERVAS {
        int id PK
        int vehiculo_id FK
        int cliente_id FK
        int usuario_id FK
        string fecha_inicio
        string hora_inicio
        string fecha_fin
        string hora_fin
        string lugar_entrega
        string lugar_devolucion
        string estado
        datetime created_at
    }
    ALQUILERES {
        int id PK
        int reserva_id FK
        string checkout_fecha
        string checkout_hora
        int checkout_km
        int checkout_combustible
        string checkin_fecha
        string checkin_hora
        int checkin_km
        decimal horas_excedente
        decimal cargo_excedente
        bool excedente_bonificado
        int bonificado_por FK
        bool contrato_firmado
    }
    CONTRATOS {
        int id PK
        int alquiler_id FK
        string url_pdf
        bool firmado
        datetime fecha_generacion
        string link_prellenado
        datetime link_expiracion
    }
    VEHICULOS ||--o{ RESERVAS : reservado_en
    CLIENTES ||--o{ RESERVAS : hace
    USUARIOS ||--o{ RESERVAS : crea
    USUARIOS ||--o{ ALQUILERES : bonifica
    RESERVAS ||--|| ALQUILERES : origina
    ALQUILERES ||--|| CONTRATOS : tiene`,

    financiero: `erDiagram
    CLIENTES {
        int id PK
        string nombre_completo
        string dni_cuit
    }
    ALQUILERES {
        int id PK
        int reserva_id FK
        decimal cargo_excedente
        bool excedente_bonificado
    }
    PAGOS {
        int id PK
        int alquiler_id FK
        int cobrado_por FK
        decimal monto
        string medio_pago
        bool con_factura
        string fecha
        text notas
    }
    CUENTAS_CORRIENTES {
        int id PK
        int cliente_id FK
        decimal saldo
        datetime updated_at
    }
    MOVIMIENTOS_CUENTA_CORRIENTE {
        int id PK
        int cuenta_corriente_id FK
        int alquiler_id FK
        string tipo
        string concepto
        decimal monto
        string fecha
    }
    ECHEQS {
        int id PK
        int alquiler_id FK
        int gasto_id FK
        string tipo
        decimal monto
        string fecha_emision
        string fecha_cobro
        string estado
        string contraparte
        string banco
        string numero_cheque
    }
    GASTOS {
        int id PK
        int vehiculo_id FK
        string tipo
        string descripcion
        decimal monto
        string medio_pago
        string fecha
    }
    PRESUPUESTOS {
        int id PK
        int cliente_id FK
        int vehiculo_id FK
        decimal tarifa_unitaria
        decimal descuento
        decimal total
        string estado
    }
    CLIENTES ||--|| CUENTAS_CORRIENTES : tiene
    CLIENTES ||--o{ PRESUPUESTOS : recibe
    ALQUILERES ||--o{ PAGOS : recibe
    ALQUILERES ||--o{ MOVIMIENTOS_CUENTA_CORRIENTE : genera
    ALQUILERES ||--o{ ECHEQS : vinculado_a
    CUENTAS_CORRIENTES ||--o{ MOVIMIENTOS_CUENTA_CORRIENTE : registra
    GASTOS ||--o{ ECHEQS : vinculado_a`,

    flota: `erDiagram
    VEHICULOS {
        int id PK
        string patente UK
        string marca
        string modelo
        int anio
        string tipo
        string color
        string estado
        int km_actual
        int km_proximo_service
        int km_entre_services
        bool activo
    }
    TARIFAS {
        int id PK
        int vehiculo_id FK
        string tipo
        decimal monto
        bool activo
        date vigencia_desde
    }
    GASTOS {
        int id PK
        int vehiculo_id FK
        string tipo
        string descripcion
        decimal monto
        string medio_pago
        string fecha
        string proveedor
        int km_al_momento
    }
    DOCUMENTOS {
        int id PK
        int vehiculo_id FK
        int cargado_por FK
        string tipo
        string nombre
        string url_archivo
        string vigencia_desde
        string vigencia_hasta
    }
    USUARIOS {
        int id PK
        string email UK
        string nombre
        string rol
    }
    VEHICULOS ||--o{ TARIFAS : tiene
    VEHICULOS ||--o{ GASTOS : tiene
    VEHICULOS ||--o{ DOCUMENTOS : tiene
    USUARIOS ||--o{ DOCUMENTOS : carga`
  };

  // Mapa de enums (info adicional, mostrada en la leyenda contextual)
  const enumInfo = {
    'estado_vehiculo': 'disponible, alquilado, reservado, en_transicion, fuera_de_servicio',
    'estado_reserva': 'pendiente, confirmada, activa, finalizada, cancelada',
    'estado_echeq': 'pendiente, cobrado, rechazado, vencido',
    'estado_presupuesto': 'borrador, enviado, aceptado, vencido',
    'medio_pago': 'efectivo, transferencia, tarjeta, cheque, echeq',
    'tipo_vehiculo': 'auto, camioneta',
    'tipo_cliente': 'particular, empresa',
    'tipo_tarifa': 'diaria, semanal, mensual',
    'tipo_movimiento': 'debito, credito',
    'tipo_echeq': 'emitido, recibido',
    'tipo_documento': 'poliza, vtv, clausulas, otro',
    'tipo_gasto': 'service, combustible, cubiertas, reparacion, seguro, patente, vtv, lavado, otro',
    'rol_usuario': 'admin, docs'
  };

  let currentZoom = 0.85;
  const container = document.getElementById('diagram-container');
  const diagramEl = document.getElementById('diagram');

  function applyZoom() {
    container.style.transform = 'scale(' + currentZoom + ')';
  }

  function zoom(delta) {
    currentZoom = Math.min(2, Math.max(0.2, currentZoom + delta));
    applyZoom();
  }

  function resetZoom() {
    currentZoom = 0.85;
    applyZoom();
  }

  applyZoom();

  // Drag to pan
  const wrapper = document.getElementById('wrapper');
  let isDragging = false, startX, startY, scrollLeft, scrollTop;

  wrapper.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    isDragging = true;
    startX = e.pageX - wrapper.offsetLeft;
    startY = e.pageY - wrapper.offsetTop;
    scrollLeft = wrapper.scrollLeft;
    scrollTop = wrapper.scrollTop;
  });

  wrapper.addEventListener('mouseleave', () => isDragging = false);
  wrapper.addEventListener('mouseup', () => isDragging = false);
  wrapper.addEventListener('mousemove', e => {
    if (!isDragging) return;
    e.preventDefault();
    const x = e.pageX - wrapper.offsetLeft;
    const y = e.pageY - wrapper.offsetTop;
    wrapper.scrollLeft = scrollLeft - (x - startX);
    wrapper.scrollTop = scrollTop - (y - startY);
  });

  // Zoom con Ctrl + rueda
  wrapper.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      zoom(e.deltaY < 0 ? 0.1 : -0.1);
    }
  }, { passive: false });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function renderView(name) {
    const code = views[name];
    diagramEl.removeAttribute('data-processed');
    diagramEl.innerHTML = '';

    try {
      const { svg } = await mermaid.render('mermaid-svg-' + Date.now(), code);
      diagramEl.innerHTML = svg;
    } catch (err) {
      diagramEl.innerHTML = '<div style="color:#dc2626;padding:20px;font-family:monospace;white-space:pre-wrap;">Error: ' + err.message + '</div>';
      console.error(err);
    }
  }

  // Wire view buttons
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      await renderView(btn.dataset.view);
      showToast('Vista: ' + btn.textContent);
    });
  });

  // Initial render
  renderView('full');
</script>
</body>
</html>
